# Controlled ablations for V3.2 (Section 7 of the work order).
#
# Every candidate shares the same V2-initialized backbone + zero-gated QAM delta
# branch, the same fixed split/seed, and the same (train/validation-only) data.
# They differ only in the loss.  A0 is not a training run: it is the frozen V2
# re-evaluation recorded in configs/qam_aware_v3_2_acceptance.yaml.
#
# Selection is on validation only.  The final blind set is never instantiated.

experiment_config: configs/qam_aware_v3_2.yaml
output_root: outputs/qam_aware_v3_2/ablation
ablation_epochs: 15

# Pre-written, validation-only selection rule.  After the ablations run, the
# winning candidate is chosen by this rule and frozen into selected_candidate
# .yaml/.json before the three-seed formal run.  No test / v2_compatible /
# final_blind_test metric ever participates in selection.
selection:
  scope: train/validation only
  metric: val_macro_f1
  tiebreak: val_accuracy
  forbid_peek: [test, v2_compatible, final_blind_test]

variants:
  a1_zero_gated_plain:
    description: "V2 + zero-gated QAM branch, plain cross-entropy (no distill, no QAM weights)"
    distillation:
      enabled: false
    class_weights: {BPSK: 1.0, QPSK: 1.0, 8PSK: 1.0, 16QAM: 1.0, 64QAM: 1.0, 2FSK: 1.0, CPFSK: 1.0, OFDM: 1.0}

  a2_zero_gated_distill:
    description: "A1 + knowledge distillation (frozen V2 teacher)"
    distillation:
      enabled: true
      temperature: 4.0
      alpha: 0.7
    class_weights: {BPSK: 1.0, QPSK: 1.0, 8PSK: 1.0, 16QAM: 1.0, 64QAM: 1.0, 2FSK: 1.0, CPFSK: 1.0, OFDM: 1.0}

  a3_distill_mild_qam_105:
    description: "A2 + mild QAM weights (16QAM/64QAM = 1.05)"
    distillation:
      enabled: true
      temperature: 4.0
      alpha: 0.7
    class_weights: {BPSK: 1.0, QPSK: 1.0, 8PSK: 1.0, 16QAM: 1.05, 64QAM: 1.05, 2FSK: 1.0, CPFSK: 1.0, OFDM: 1.0}

  a3_distill_mild_qam_110:
    description: "A2 + mild QAM weights (16QAM/64QAM = 1.10)"
    distillation:
      enabled: true
      temperature: 4.0
      alpha: 0.7
    class_weights: {BPSK: 1.0, QPSK: 1.0, 8PSK: 1.0, 16QAM: 1.10, 64QAM: 1.10, 2FSK: 1.0, CPFSK: 1.0, OFDM: 1.0}
