# These are promotion gates, not claims that an untrained V3.2 already passes.
# They are identical to the V3/V3.1 gates: the acceptance bar is never lowered.
promotion_gates:
  minimum_accuracy_gain: 0.02
  minimum_macro_f1_gain: 0.02
  minimum_qam_mean_gain: 0.05
  maximum_per_class_accuracy_drop: 0.03
  maximum_key_snr_accuracy_drop: 0.01

# The formal run is three independent seeds.  The final promotion decision is a
# fixed rule (never lowered, never cherry-picked):
#
#   * improvement_on: mean    -> the three-seed MEAN of accuracy / macro-F1 /
#                                QAM mean must clear the three minimum_*_gain
#                                bars above.
#   * regression_floors_on: every_seed -> EVERY seed must individually clear the
#                                maximum_*_drop caps (per-class and 0/10/20 dB),
#                                so no single seed may regress a class or SNR
#                                band even if the mean is healthy.
#
# Final PASS = both halves hold.  Thresholds are the promotion_gates above.
multi_seed:
  seeds: [2026, 2027, 2028]
  rule: mean_improvement_and_per_seed_regression_floors
  improvement_on: mean
  regression_floors_on: every_seed
