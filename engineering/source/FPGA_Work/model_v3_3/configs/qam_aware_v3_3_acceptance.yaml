# V3.3 multi-seed promotion gate.  Identical improvement/regression bars to V3/
# V3.1/V3.2 — the acceptance bar is never lowered.  The only addition is the
# FPGA-sim-vs-FP32 numeric-domain gap floor (a V3.3 requirement: the deployed
# graph must not be materially weaker under the FPGA Mandatory-Core emulated
# input domain than under full precision).

reference: frozen_qam_aware_v2_time_power_phase
source_report: outputs/qam_aware_v2/formal/time_power_phase/tables/evaluation.json
v2:
  accuracy: 0.7054761904761905
  macro_f1: 0.697538161950682
  qam_mean_accuracy: 0.46476190476190476
  per_class_accuracy:
    BPSK: 0.7952380952380952
    QPSK: 0.64
    8PSK: 0.6352380952380953
    16QAM: 0.5076190476190476
    64QAM: 0.4219047619047619
    2FSK: 0.9076190476190477
    CPFSK: 0.8771428571428571
    OFDM: 0.8590476190476191
  snr_accuracy:
    "0": 0.8535
    "10": 0.9265
    "20": 0.933

# These are promotion gates, not claims that an untrained V3.3 already passes.
# They are identical to the V3/V3.1/V3.2 gates; the acceptance bar is never
# lowered.
promotion_gates:
  minimum_accuracy_gain: 0.02
  minimum_macro_f1_gain: 0.02
  minimum_qam_mean_gain: 0.05
  maximum_per_class_accuracy_drop: 0.03
  maximum_key_snr_accuracy_drop: 0.01
  # V3.3-only addition: the FPGA Mandatory-Core emulated input domain must not be
  # materially weaker than full precision on the identical dev namespace.
  maximum_fpga_sim_accuracy_gap: 0.03
  maximum_fpga_sim_macro_f1_gap: 0.03

# The formal run is three independent seeds.  The final promotion decision is a
# fixed rule (never lowered, never cherry-picked):
#
#   * improvement_on: mean    -> the three-seed MEAN of accuracy / macro-F1 /
#                                QAM mean must clear the three minimum_*_gain
#                                bars above.
#   * regression_floors_on: every_seed -> EVERY seed must individually clear the
#                                maximum_*_drop caps (per-class and 0/10/20 dB),
#                                so no single seed may regress a class or SNR
#                                band even if the mean is healthy.
#   * fpga_sim_gap: every_seed -> every seed's FPGA-sim accuracy/macro-F1 gap vs
#                                its own FP32 must clear the gap floors.
#
# Final PASS = all three halves hold.  Thresholds are the promotion_gates above.
multi_seed:
  seeds: [2026, 2027, 2028]
  rule: mean_improvement_and_per_seed_regression_floors
  improvement_on: mean
  regression_floors_on: every_seed
  fpga_sim_gap_on: every_seed
