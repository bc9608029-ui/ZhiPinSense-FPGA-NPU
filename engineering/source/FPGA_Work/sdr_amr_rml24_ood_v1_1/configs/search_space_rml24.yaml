# Frozen search space for the bounded 24-class hyperparameter pilot (Optuna TPE).
# <= 12 pilot trials; pilot trials are deduplicated by canonical candidate
# signature before ranking, and by default exactly ONE candidate is promoted to
# 3 formal seeds (budget = 3 runs).  A second candidate is promoted only with
# --allow-second-candidate and an explicit better-in-key-dimension justification.

search:
  pilot_seed: 2026
  pilot_epochs: 20
  n_pilot_trials: 12
  formal_seeds: [2026, 2027, 2028]
  formal_epochs: 80
  prune:
    selection_metric_below: 0.55
    top_candidates: 1

  # Axes sampled by TPE (discrete).  No augmentation groups: RadioML is already a
  # received signal; synthetic channel augmentation is a separate M8 ablation.
  losses: [cross_entropy, focal, label_smoothing, class_balanced]
  optimizers: [adamw, sgd]
  learning_rates_adamw: [1.0e-3, 3.0e-4, 1.0e-4]
  weight_decays_adamw: [1.0e-4, 1.0e-5]
  learning_rates_sgd: [1.0e-2, 3.0e-3]
  focal_gammas: [1.0, 2.0, 3.0]
  label_smoothings: [0.05, 0.1]
